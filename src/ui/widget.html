<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Codex × Claude Orchestrator</title>
  <style>
    :root { color-scheme: light dark; --bg:#111318; --card:#1b1e27; --line:#303542; --text:#f4f5f7; --muted:#9ba3b4; --accent:#d97757; --green:#47c883; --warn:#f4bc5b; --red:#f36b73; }
    * { box-sizing:border-box } body { margin:0; padding:18px; background:var(--bg); color:var(--text); font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; } header { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:16px; } h1 { font-size:18px; margin:0; } button { border:1px solid var(--line); background:#252a35; color:var(--text); border-radius:7px; padding:7px 10px; cursor:pointer; } button:hover { border-color:var(--accent) } button.primary { background:var(--accent); border-color:var(--accent); color:white } button.danger { color:var(--red) } .pill { border-radius:999px; padding:3px 8px; background:#252a35; color:var(--muted); } .grid { display:grid; gap:12px; } .summary { grid-template-columns:repeat(4,minmax(0,1fr)); } .card { border:1px solid var(--line); border-radius:10px; background:var(--card); padding:12px; } .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; } .value { font-size:20px; font-weight:650; margin-top:2px; } .task { margin-top:12px; } .task-head { display:flex; justify-content:space-between; gap:8px; } .actions { display:flex; gap:6px; align-items:center; flex-wrap:wrap } .node { display:grid; grid-template-columns:130px 1fr auto; gap:8px; align-items:center; padding:9px 0; border-top:1px solid var(--line); } .node:first-child { margin-top:10px; } .muted { color:var(--muted); } .status-running { color:var(--accent) } .status-review,.status-passed,.status-merged { color:var(--green) } .status-blocked,.status-failed { color:var(--red) } pre { max-height:220px; overflow:auto; white-space:pre-wrap; color:#c7cedd; background:#101217; border-radius:7px; padding:10px; } dialog { width:min(520px,calc(100% - 32px)); border:1px solid var(--line); border-radius:12px; background:var(--card); color:var(--text); padding:18px; } dialog::backdrop { background:#0009 } label { display:block; margin:10px 0 4px; color:var(--muted) } input,textarea,select { width:100%; color:var(--text); background:#101217; border:1px solid var(--line); border-radius:7px; padding:8px; } textarea { min-height:74px; resize:vertical } #notice { min-height:22px; margin:8px 0; color:var(--warn) } @media (max-width:700px) { .summary { grid-template-columns:repeat(2,minmax(0,1fr)); } .node { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header><div><h1>Codex × Claude Orchestrator</h1><div class="muted">隔离 worktree · 实时回归 · 安全合并</div></div><div class="actions"><span id="claude" class="pill">检测中…</span><button id="new-task" class="primary">新建任务</button><button id="refresh">刷新</button></div></header>
  <div id="notice"></div>
  <div class="grid summary"><div class="card"><div class="label">任务</div><div id="tasks" class="value">0</div></div><div class="card"><div class="label">运行节点</div><div id="running" class="value">0</div></div><div class="card"><div class="label">待审查</div><div id="review" class="value">0</div></div><div class="card"><div class="label">冲突/失败</div><div id="blocked" class="value">0</div></div></div>
  <div id="content" class="grid"></div>
  <div class="card task"><div class="label">最近事件</div><pre id="events">暂无事件</pre></div>
  <dialog id="task-dialog"><form method="dialog"><h2>新建编排任务</h2><label>标题</label><input name="title" placeholder="例如：实现登录模块"><label>总目标</label><textarea name="goal" required placeholder="可验证的最终目标"></textarea><div class="actions" style="margin-top:14px"><button value="cancel">取消</button><button id="create-task" value="default" class="primary">创建</button></div></form></dialog>
  <dialog id="node-dialog"><form method="dialog"><h2>添加任务节点</h2><input type="hidden" name="taskId"><label>标题</label><input name="title" required><label>节点目标</label><textarea name="goal" required></textarea><label>Agent</label><select name="agent"><option value="claude">Claude</option><option value="codex">Codex</option></select><label>职责角色</label><input name="role" placeholder="implementation / reviewer / tester"><label>允许工具（逗号分隔）</label><input name="tools" placeholder="Read, Edit, Bash(npm test)"><label>文件范围（逗号分隔，目录以 / 结尾）</label><input name="files" placeholder="src/api/, test/api.test.js"><label>结构化 Input（JSON）</label><textarea name="input">{}</textarea><div class="actions" style="margin-top:14px"><button value="cancel">取消</button><button id="create-node" value="default" class="primary">添加</button></div></form></dialog>
  <script>
    const pending = new Map(); let requestId = 0;
    window.addEventListener('message', (event) => { const message=event.data; if(message?.jsonrpc==='2.0' && pending.has(message.id)) { const {resolve,reject}=pending.get(message.id); pending.delete(message.id); message.error?reject(new Error(message.error.message)):resolve(message.result); } if(message?.method==='ui/notifications/tool-result' && message.params) render(message.params.structuredContent||message.params); });
    const call = async (name, args={}) => { let result;if (window.openai?.callTool) result=await window.openai.callTool(name,args);else{const id=++requestId;const response=new Promise((resolve,reject)=>{pending.set(id,{resolve,reject});setTimeout(()=>{if(pending.delete(id))reject(new Error('MCP bridge timeout'));},10000);});window.parent.postMessage({jsonrpc:'2.0',id,method:'tools/call',params:{name,arguments:args}},'*');result=await response;}if(result?.isError)throw new Error(result.content?.map(item=>item.text).filter(Boolean).join('\n')||'工具调用失败');return result;};
    const esc = (v) => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const actionButtons=(t,n)=>{if(n.agent==='claude'&&['planned','failed','blocked'].includes(n.status))return `<button data-action="dispatch" data-task="${esc(t.id)}" data-node="${esc(n.id)}">${n.status==='planned'?'派发':'重试'}</button>`;if(n.status==='running')return `<button class="danger" data-action="stop" data-node="${esc(n.id)}">停止</button>`;if(n.status==='review')return `<button data-action="validate" data-task="${esc(t.id)}" data-node="${esc(n.id)}">验证</button><button class="danger" data-action="discard" data-task="${esc(t.id)}" data-node="${esc(n.id)}">驳回</button><button class="primary" data-action="merge" data-task="${esc(t.id)}" data-node="${esc(n.id)}">合并</button>`;return ''};
    function render(state) { const tasks=Object.values(state.tasks||{}), nodes=tasks.flatMap(t=>t.nodes||[]); document.querySelector('#tasks').textContent=tasks.length; document.querySelector('#running').textContent=nodes.filter(n=>n.status==='running').length; document.querySelector('#review').textContent=nodes.filter(n=>n.status==='review').length; document.querySelector('#blocked').textContent=nodes.filter(n=>['blocked','failed'].includes(n.status)).length; document.querySelector('#content').innerHTML=tasks.length?tasks.map(t=>`<section class="card task"><div class="task-head"><div><strong>${esc(t.title)}</strong><div class="muted">${esc(t.goal)}</div></div><div class="actions"><button data-action="add-node" data-task="${esc(t.id)}">添加节点</button><span class="pill">${esc(t.status)}</span></div></div>${(t.nodes||[]).map(n=>`<div class="node"><div><strong>${esc(n.title)}</strong><div class="muted">${esc(n.agent)} · ${esc(n.role)} · ${esc(n.id)}</div></div><div class="muted">${esc(n.goal)}<br>${n.files?.length?esc(n.files.join(', ')):'未限定文件范围'}${n.tools?.length?`<br>Tools: ${esc(n.tools.join(', '))}`:''}</div><div class="actions"><span class="status-${esc(n.status)}">${esc(n.status)}</span>${actionButtons(t,n)}</div></div>`).join('')}</section>`).join(''):'<section class="card task muted">还没有任务。点击“新建任务”设置总目标。</section>'; document.querySelector('#events').textContent=(state.events||[]).slice(-18).reverse().map(e=>`[${e.at}] ${e.type} ${JSON.stringify(e)}`).join('\n')||'暂无事件'; }
    const notify=(message,error=false)=>{const el=document.querySelector('#notice');el.textContent=message;el.style.color=error?'var(--red)':'var(--warn)'};
    async function refresh() { try { const result=await call('orchestrator_get_state'); if(result?.structuredContent) render(result.structuredContent); const status=await call('claude_status'); const s=status?.structuredContent||status; if(s?.claude) document.querySelector('#claude').textContent=s.claude.installed?(s.claude.connected?`Claude ${s.claude.version||'ready'}`:'Claude 未登录'):'Claude 未安装'; } catch(error){notify(error.message,true)} }
    document.querySelector('#refresh').addEventListener('click', refresh); refresh(); setInterval(refresh, 1800);
    document.querySelector('#new-task').addEventListener('click',()=>document.querySelector('#task-dialog').showModal());
    document.querySelector('#create-task').addEventListener('click',async(event)=>{event.preventDefault();const form=document.querySelector('#task-dialog form'),data=new FormData(form);try{await call('orchestrator_create_task',{title:data.get('title'),goal:data.get('goal')});form.reset();document.querySelector('#task-dialog').close();notify('任务已创建');await refresh()}catch(error){notify(error.message,true)}});
    document.querySelector('#create-node').addEventListener('click',async(event)=>{event.preventDefault();const form=document.querySelector('#node-dialog form'),data=new FormData(form);try{await call('orchestrator_add_node',{taskId:data.get('taskId'),title:data.get('title'),goal:data.get('goal'),agent:data.get('agent'),role:data.get('role'),tools:String(data.get('tools')||'').split(',').map(x=>x.trim()).filter(Boolean),files:String(data.get('files')||'').split(',').map(x=>x.trim()).filter(Boolean),input:JSON.parse(data.get('input')||'{}')});form.reset();document.querySelector('#node-dialog').close();notify('节点已添加');await refresh()}catch(error){notify(error.message,true)}});
    document.querySelector('#content').addEventListener('click',async(event)=>{const button=event.target.closest('button[data-action]');if(!button)return;const action=button.dataset.action;try{if(action==='add-node'){const form=document.querySelector('#node-dialog form');form.elements.taskId.value=button.dataset.task;document.querySelector('#node-dialog').showModal();return}button.disabled=true;if(action==='dispatch')await call('orchestrator_dispatch_node',{taskId:button.dataset.task,nodeId:button.dataset.node});if(action==='stop')await call('orchestrator_stop_node',{nodeId:button.dataset.node});if(action==='validate')await call('orchestrator_validate_node',{taskId:button.dataset.task,nodeId:button.dataset.node});if(action==='discard'&&confirm('确认驳回并删除该节点 worktree/分支？'))await call('orchestrator_discard_node',{taskId:button.dataset.task,nodeId:button.dataset.node});if(action==='merge'&&confirm('确认把该 Claude 分支合并到当前 Codex 分支？'))await call('orchestrator_merge_node',{taskId:button.dataset.task,nodeId:button.dataset.node});notify(`操作 ${action} 已提交`);await refresh()}catch(error){notify(error.message,true)}finally{button.disabled=false}});
  </script>
</body>
</html>
